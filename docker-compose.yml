services:
  backend:
    build:
      context: ./foodie-backend
      dockerfile: Dockerfile
    env_file:
      - ./foodie-backend/.env
    environment:
      PORT: "4000"
      PUBLIC_API_ORIGIN: "http://localhost:4000"
      CHAT_API_URL: "https://chat.pupuia.com/api"
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./foodie-backend:/app
      - foodie_backend_node_modules:/app/node_modules
    restart: unless-stopped
    command: sh -c "npx prisma generate --schema prisma/schema.prisma && npx prisma migrate deploy --schema prisma/schema.prisma && npm run dev"

  frontend:
    build:
      context: ./foodie-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000/v1"
        CHAT_API_URL: "https://chat.pupuia.com/api"
    env_file:
      - ./foodie-frontend/.env
      - ./foodie-frontend/.env.production
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/v1"
      CHAT_API_URL: "https://chat.pupuia.com/api"
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./foodie-frontend:/app
      - foodie_frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  foodie_backend_node_modules:
  foodie_frontend_node_modules:


